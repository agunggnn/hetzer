    <text x="238" y="150" text-anchor="start">███████║█████╗     ██║     ███╔╝ █████╗  ██████╔╝</text>
    <text x="238" y="169" text-anchor="start">██╔══██║██╔══╝     ██║    ███╔╝  ██╔══╝  ██╔══██╗</text>
    <text x="238" y="188" text-anchor="start">██║  ██║███████╗   ██║   ███████╗███████╗██║  ██║</text>
    <text x="238" y="207" text-anchor="start">╚═╝  ╚═╝╚══════╝   ╚═╝   ╚══════╝╚══════╝╚═╝  ╚═╝</text>
  </g>

