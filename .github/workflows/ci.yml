name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify -- --no-write
      - name: Validate unused or idempotent release version
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-metadata.mjs
      - run: npm run build:package

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Validate initialized core project
        run: |
          node cli/bin/hetzer.js init "$RUNNER_TEMP/hetzer-smoke"
          cd "$RUNNER_TEMP/hetzer-smoke"
          node "$GITHUB_WORKSPACE/cli/bin/hetzer.js" doctor
