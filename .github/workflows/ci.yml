name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify -- --no-write
      - name: Validate unused or idempotent release version
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-metadata.mjs
      - run: npm run build:package

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 22
      - run: npm ci
      - name: Validate initialized core project
        run: |
          node cli/bin/hetzer.js init "$RUNNER_TEMP/hetzer-smoke"
          cd "$RUNNER_TEMP/hetzer-smoke"
          node "$GITHUB_WORKSPACE/cli/bin/hetzer.js" doctor
