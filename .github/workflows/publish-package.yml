name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: publish-gpr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@agunggnn'

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run empirical verification
        run: npm run verify -- --no-write

      - name: Check whether this package version already exists
        id: package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          if npm view "$package_name@$package_version" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to GitHub Packages
        if: steps.package.outputs.exists != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Report existing package
        if: steps.package.outputs.exists == 'true'
        run: echo "GitHub Package v${{ steps.package.outputs.version }} already exists; publish skipped."
