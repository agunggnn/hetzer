name: Release main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run empirical verification
        run: npm run verify -- --no-write

      - name: Validate release version
        id: metadata
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-metadata.mjs

      - name: Build registry packages
        run: npm run build:package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hetzer-packages-${{ steps.metadata.outputs.tag }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Create annotated version tag
        if: steps.metadata.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Hetzer $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Check for an existing GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.github_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/*.tgz --verify-tag --title "Hetzer $RELEASE_TAG" --generate-notes

      - name: Refresh artifacts on an existing release
        if: steps.github_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.tgz --clobber

  publish-gpr:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-package.yml
