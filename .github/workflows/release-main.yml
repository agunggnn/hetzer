name: Release main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run empirical verification
        run: npm run verify -- --no-write

      - name: Validate release version
        id: metadata
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-metadata.mjs

      - name: Build registry packages
        run: npm run build:package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hetzer-packages-${{ steps.metadata.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create annotated version tag
        if: steps.metadata.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Hetzer $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Check for an existing GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.github_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "Hetzer $RELEASE_TAG" --generate-notes

      - name: Refresh artifacts on an existing release
        if: steps.github_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber

  publish-gpr:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-package.yml

  publish-npm:
    # Stages the unscoped `hetzer` package on npmjs through npm trusted publishing (OIDC), so no npm token is
    # stored in this repository. npmjs.com trusts this file by name: the trusted publisher for `hetzer` must name
    # owner `agunggnn`, repository `hetzer` and workflow `release-main.yml`. Keep this job in this file; npm checks
    # the calling workflow, not a reusable one. A maintainer approves each staged version with 2FA on npmjs.com.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later and `npm stage publish` needs 11.15.0 or later; Node 22
      # bundles npm 10.
      - name: Install npm with staged publishing
        run: npm install -g npm@11.20.0

      - name: Check whether this version is already on npmjs
        id: npm
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if npm view "hetzer@$RELEASE_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish the tarball attached to the GitHub Release, so npmjs serves the same bytes as checksums.txt.
      - name: Download and verify the released tarball
        if: steps.npm.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          tarball="hetzer-$RELEASE_VERSION.tgz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "$tarball" --pattern checksums.txt
          cd release
          awk -v file="$tarball" '$2 == file && length($1) == 64' checksums.txt > expected.sha256
          test "$(wc -l < expected.sha256)" -eq 1
          sha256sum --check --strict expected.sha256
          # shellcheck disable=SC2016 # ${...} below is a JavaScript template literal, not shell.
          tar -xzOf "$tarball" package/package.json | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => { text += chunk; }).on("end", () => {
              const manifest = JSON.parse(text);
              const expected = { name: "hetzer", version: process.env.RELEASE_VERSION,
                repository: "git+https://github.com/agunggnn/hetzer.git" };
              const actual = { name: manifest.name, version: manifest.version, repository: manifest.repository?.url };
              if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                console.error(`Tarball manifest ${JSON.stringify(actual)} does not match ${JSON.stringify(expected)}.`);
                process.exit(1);
              }
            });'

      - name: Stage the package on npmjs
        if: steps.npm.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: npm stage publish "./release/hetzer-$RELEASE_VERSION.tgz"

      - name: Report the approval step
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.npm.outputs.exists }}
        run: |
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "hetzer@$RELEASE_VERSION is already published on npmjs; nothing staged." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "hetzer@$RELEASE_VERSION is staged on npmjs and is not public until a maintainer approves it with 2FA:"
              echo ""
              echo "- npmjs.com: https://www.npmjs.com/package/hetzer, Staged Packages tab, Approve"
              echo "- CLI: \`npm stage list hetzer\`, then \`npm stage approve <stage-id>\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
